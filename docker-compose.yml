services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: git-for-law-falkordb
    ports:
      - "127.0.0.1:6379:6379"
      - "100.74.52.37:6379:6379"
      - "127.0.0.1:3010:3000"
      - "100.74.52.37:3010:3000"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15.0-community
    container_name: git-for-law-neo4j
    ports:
      - "127.0.0.1:7474:7474"       # HTTP, local
      - "100.74.52.37:7474:7474"    # HTTP, Tailscale
      - "127.0.0.1:7687:7687"       # Bolt, local
      - "100.74.52.37:7687:7687"    # Bolt, Tailscale
    environment:
      - NEO4J_AUTH=neo4j/gitforlaw123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  falkordb_data:
  neo4j_data:
  neo4j_logs:
