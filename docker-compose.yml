services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: git-for-law-falkordb
    ports:
      - "6379:6379"
      - "3010:3000"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15.0-community
    container_name: git-for-law-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/gitforlaw123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  falkordb_data:
  neo4j_data:
  neo4j_logs:
